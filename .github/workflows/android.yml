name: Android CI
on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      instrumentation:
        description: Run Android API 30 instrumentation tests on demand
        type: boolean
        default: false

concurrency:
  group: gallerybridge-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Test, lint, build and sign
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-setup
      - name: Run unit tests, lint, Detekt and build APKs
        run: bash .github/scripts/check-android.sh

      # Instrumentation is opt-in; regular commits and releases do not wait for an emulator.
      - name: Build instrumentation APK
        if: github.event_name == 'workflow_dispatch' && inputs.instrumentation
        run: |
          bash ./gradlew --build-cache --parallel :app:assembleDebugAndroidTest
          mkdir -p android-build/androidTest
          cp -R app/build/outputs/apk/debug android-build/
          cp -R app/build/outputs/apk/androidTest/debug android-build/androidTest/
      - name: Enable KVM
        if: github.event_name == 'workflow_dispatch' && inputs.instrumentation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumentation API 30
        if: github.event_name == 'workflow_dispatch' && inputs.instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          system-image-api-level: '30'
          arch: x86_64
          target: default
          disable-animations: true
          script: bash .github/scripts/instrument-apks.sh
      - name: Sign and verify APK
        if: github.repository == 'igorcv88/GalleryBridge'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash .github/scripts/build-signed-apk.sh
      - uses: actions/upload-artifact@v4
        if: github.repository == 'igorcv88/GalleryBridge'
        with:
          name: GalleryBridge-signed-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
