name: Android checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - run: ./gradlew --no-daemon :engine:test :app:testDebugUnitTest :app:lintDebug detekt :app:assembleDebug :app:assembleDebugAndroidTest
      - run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallerybridge-host-and-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/lint-results-debug.*
            engine/build/test-results/test/*.xml
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: gallerybridge-instrumentation-build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7
  instrumented:
    needs: host
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ['30', '37.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gallerybridge-instrumentation-build
          path: android-build
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          system-image-api-level: ${{ matrix.image }}
          arch: x86_64
          target: default
          disable-animations: true
          script: bash .github/scripts/instrument-apks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallerybridge-android-tests-api-${{ matrix.image }}
          path: android-instrumentation.txt
