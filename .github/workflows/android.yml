name: Android CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-setup
      - run: bash .github/scripts/check-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: gallerybridge-instrumentation-build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  instrumented:
    needs: host
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ['30', '37.0']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: gallerybridge-instrumentation-build
          path: android-build
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          system-image-api-level: ${{ matrix.image }}
          arch: x86_64
          target: default
          disable-animations: true
          script: bash .github/scripts/instrument-apks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallerybridge-android-tests-api-${{ matrix.image }}
          path: android-instrumentation.txt
          retention-days: 1
  signed-apk:
    needs: [host, instrumented]
    # Pushes build the exact commit; external PRs run tests without signing secrets.
    if: github.repository == 'igorcv88/GalleryBridge' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-setup
      - run: bash ./gradlew --no-daemon :app:assembleRelease
      - name: Sign and verify APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash .github/scripts/build-signed-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GalleryBridge-signed-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
