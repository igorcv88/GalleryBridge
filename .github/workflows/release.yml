name: Publish APK Release
on:
  pull_request_target:
    branches: [main]
    types: [closed]
permissions:
  contents: read
jobs:
  release:
    if: github.event.pull_request.merged == true && github.repository == 'igorcv88/GalleryBridge'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: gallerybridge-release-main
      cancel-in-progress: false
    steps:
      # Never check out the PR head. Only the commit already merged into main is trusted.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - name: Verify merged commit
        env:
          MERGED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$MERGED_SHA"
          git merge-base --is-ancestor "$MERGED_SHA" origin/main
      - uses: ./.github/actions/android-setup
      - name: Run unit tests, lint, Detekt and build APKs
        run: bash .github/scripts/check-android.sh
      - name: Sign and verify APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bash .github/scripts/build-signed-apk.sh
      - name: Publish directly to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PRERELEASE: ${{ contains(github.event.pull_request.labels.*.name, 'release:prerelease') }}
        run: bash .github/scripts/publish-release.sh
